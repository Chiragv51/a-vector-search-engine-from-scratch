[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-search-scratch"
version = "0.1.0"
description = "A practical, measurement-first vector search engine from scratch: exact KNN, NumPy vectorization, HNSW, filtering, quantization, and fair FAISS benchmarks."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chirag" }
]
dependencies = [
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
